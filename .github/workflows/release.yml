name: Release

# Publishing a GitHub release vX.Y.Z builds the signed APK as version X.Y.Z and attaches it to the release
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  apk:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Lint and test
        run: |
          flutter analyze
          flutter test

      # The release key lives in Infisical (project ci, /android/digi-mobile); GitHub logs in with OIDC, no stored secret
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 59a77282-0ae7-428f-99b2-b253c69e58d8
          domain: https://eu.infisical.com
          project-id: 815c357a-baf5-41fa-9d10-41f718c63a8a
          env-slug: prod
          secret-path: /android/digi-mobile

      - name: Write signing key
        env:
          KEYSTORE: ${{ env.DIGI_KEYSTORE_BASE64 }}
          PASSWORD: ${{ env.DIGI_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] || { echo "DIGI_KEYSTORE_BASE64 and DIGI_KEYSTORE_PASSWORD are missing in Infisical"; exit 1; }
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=release\n' "$PASSWORD" "$PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/digi-mobile.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/digi-mobile.apk --clobber
