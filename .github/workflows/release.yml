name: Release

# A v* tag releases the Android app, a manual run only builds it (the APK as a run artifact)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] || { echo "ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required"; exit 1; }
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=release\n' "$PASSWORD" "$PASSWORD" > android/key.properties

      - name: Build APK
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && version="--build-name ${GITHUB_REF_NAME#v}"
          flutter build apk --release $version --build-number "$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/app-release.apk --generate-notes
