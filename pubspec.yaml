name: digi_mobile
description: Unofficial app to follow your DIGI Belgium mobile usage
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: launcher_icon
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#002BFE"
  adaptive_icon_foreground: assets/icon/foreground.png
